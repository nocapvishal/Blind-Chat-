<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blind Chat in Campus</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="app">

<!-- EMAIL SCREEN -->
<div id="email-screen" class="screen active">
<h1>Blind Chat in Campus 💜</h1>
<input id="emailInput" placeholder="yourname@pondiuni.ac.in">
<button id="verifyBtn">Continue</button>
<p id="emailError"></p>
</div>

<!-- PROFILE SCREEN -->
<div id="profile-screen" class="screen">
<input id="nickname" placeholder="Nickname">

<select id="gender">
<option>Male</option>
<option>Female</option>
</select>

<select id="prefGender">
<option value="Any">Match with Anyone</option>
<option>Male</option>
<option>Female</option>
</select>

<select id="intent">
<option>Friends</option>
<option>Dating</option>
<option>Casual</option>
</select>

<button id="startBtn">Start Chat</button>
</div>

<!-- SEARCH SCREEN -->
<div id="search-screen" class="screen">
<div class="loader"></div>
<h2>Finding someone from campus…</h2>
</div>

<!-- CHAT SCREEN -->
<div id="chat-screen" class="screen">
<div class="chat-header">
<span id="partnerName">Connected</span>
<button id="skipBtn">Skip</button>
</div>

<div id="chatBox"></div>

<div class="chat-input">
<input id="msgInput" placeholder="Type message 😊">
<button id="sendBtn">Send</button>
</div>
</div>

<footer class="footer">
<a href="/legal/terms.html">Terms</a>
<a href="/legal/privacy.html">Privacy</a>
<a href="/legal/guidelines.html">Guidelines</a>
</footer>

</div>
<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
