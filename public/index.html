<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Blind Chat in Campus</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

<h1>Blind Chat in Campus</h1>
<div id="onlineCount">0 online</div>

<div id="profile-screen" class="screen active">
<input id="nickname" placeholder="Nickname">
<select id="gender"><option>Male</option><option>Female</option></select>
<select id="prefGender"><option>Any</option><option>Male</option><option>Female</option></select>
<select id="dept"><option>Any</option><option>CSE</option><option>ECE</option></select>
<select id="year"><option>Any</option><option>1</option><option>2</option><option>3</option><option>4</option></select>
<button id="startBtn">Start Chat</button>
</div>

<div id="chat-screen" class="screen">
<div id="partnerName"></div>
<div id="chatBox"></div>
<div id="typing"></div>

<input id="msgInput" placeholder="Message… 😊">
<button id="sendBtn">Send</button>

<div class="actions">
<button id="skipBtn">Skip</button>
<button id="revealBtn">Reveal</button>
</div>
</div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
