<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Blind Chat in Campus</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

<h1>Blind Chat in Campus</h1>
<div id="partnerName"></div>

<div id="profile-screen">

<input id="nickname" placeholder="Nickname">

<select id="gender">
<option value="Male">Male</option>
<option value="Female">Female</option>
</select>

<select id="prefGender">
<option value="Any">Match with Anyone</option>
<option value="Male">Male</option>
<option value="Female">Female</option>
</select>

<select id="dept">
<option value="Any">Any Dept</option>
<option>CSE</option>
<option>ECE</option>
</select>

<select id="year">
<option value="Any">Any Year</option>
<option>1</option><option>2</option><option>3</option><option>4</option>
</select>

<button id="startBtn">Start Chat</button>

</div>

<div id="chat-screen" style="display:none">

<div id="chatBox"></div>
<input id="msgInput" placeholder="Message… 😊">
<button id="sendBtn">Send</button>

<button id="skipBtn">Skip</button>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
