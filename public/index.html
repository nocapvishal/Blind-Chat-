<!DOCTYPE html>
<html>
<head>
<title>Blind Chat in Campus</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<!-- EMAIL LOGIN -->
<div id="login-screen" class="screen active">
<h2>Blind Chat in Campus</h2>
<input id="emailInput" placeholder="yourname@pondiuni.ac.in">
<button id="loginBtn">Continue</button>
</div>

<!-- PROFILE -->
<div id="profile-screen" class="screen">
<select id="dept"><option>Department</option><option>CSE</option><option>ECE</option></select>
<select id="course"><option>Course</option><option>BTech</option><option>MSc</option></select>
<select id="year"><option>Year</option><option>1</option><option>2</option><option>3</option><option>4</option></select>
<button id="saveProfileBtn">Save</button>
<button id="skipProfileBtn">Skip</button>
</div>

<!-- START -->
<div id="start-screen" class="screen">
<button id="startBtn">Start Chat</button>
</div>

<!-- CONNECTING -->
<div id="connecting-screen" class="screen">
<h2 id="status">Searching for another student...</h2>
</div>

<!-- CHAT -->
<div id="chat-screen" class="screen">
<div id="onlineCount">Online: 0</div>
<div id="partnerName"></div>

<div id="chatBox"></div>
<div id="typingIndicator"></div>

<input id="messageInput" placeholder="Type message...">
<button id="sendBtn">Send</button>

<div class="actions">
<button id="skipBtn">Skip</button>
<button id="reportBtn">Report</button>
<button id="revealBtn">Reveal</button>
</div>
</div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
