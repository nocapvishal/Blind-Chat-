<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blind Chat in Campus</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<!-- SCREEN 1 : PROFILE -->
<div id="profile-screen" class="screen active">
  <h1>Blind Chat in Campus 💜</h1>

  <input id="nickname" placeholder="Nickname">

  <select id="gender">
    <option value="Male">Male</option>
    <option value="Female">Female</option>
  </select>

  <select id="prefGender">
    <option value="Any">Match with Anyone</option>
    <option value="Male">Male</option>
    <option value="Female">Female</option>
  </select>

  <select id="dept">
    <option value="Any">Any Department</option>
    <option>CSE</option>
    <option>ECE</option>
  </select>

  <select id="year">
    <option value="Any">Any Year</option>
    <option>1st Year</option>
    <option>2nd Year</option>
    <option>3rd Year</option>
    <option>4th Year</option>
  </select>

  <button id="startBtn">Start Chat</button>
</div>


<!-- SCREEN 2 : SEARCHING -->
<div id="search-screen" class="screen">
  <div class="loader"></div>
  <h2>Finding someone from campus…</h2>
</div>


<!-- SCREEN 3 : CHAT -->
<div id="chat-screen" class="screen">
  <div class="chat-header">
    <span id="partnerName">Connected</span>
    <button id="skipBtn">Skip</button>
  </div>

  <div id="chatBox"></div>

  <div class="chat-input">
    <input id="msgInput" placeholder="Type message… 😊">
    <button id="sendBtn">Send</button>
  </div>
</div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
